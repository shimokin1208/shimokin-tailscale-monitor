<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Shimokin · 设备监控</title>
<style>
:root{
  --card:rgba(255,255,255,.78);
  --card-solid:#fff;
  --line:rgba(17,24,39,.08);
  --text:#20242e;
  --muted:#7c8494;
  --accent:#4f7cff;
  --green:#12a150;
  --red:#e5484d;
  --gold:#b7791f;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);
  font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#f2f4f8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 背景 */
#wall{
  position:fixed;inset:0;z-index:-2;
  background-size:cover;background-position:center;opacity:1;transform:scale(1.02);
  transition:background-image .8s ease, opacity .35s ease;
}
#shade{
  position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(247,249,252,.35),rgba(247,249,252,.48) 45%,rgba(242,244,248,.58));
  backdrop-filter:blur(2px);
}
main{width:min(960px,calc(100% - 36px));margin:auto;padding:46px 0 64px}

/* 头部 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}
.logo{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#8fb0ff,#b7f0d8);
  display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;
  box-shadow:0 8px 22px rgba(79,124,255,.25);
}
.eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}

/* 按钮 */
button,.btn{
  border:1px solid var(--line);background:rgba(255,255,255,.72);
  color:var(--text);border-radius:11px;padding:8px 14px;font:inherit;font-size:13.5px;
  cursor:pointer;transition:.18s ease;backdrop-filter:blur(8px);
}
button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,41,55,.08)}
button:active{transform:none}
.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.primary:hover{background:#3f6df0;box-shadow:0 8px 20px rgba(79,124,255,.3)}
.actions{display:flex;gap:9px;flex-wrap:wrap}

/* 卡片 */
.panel{
  background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.86);
  border-radius:var(--radius);padding:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 30px rgba(31,41,55,.07),0 1px 2px rgba(31,41,55,.04);
}

/* 主卡片 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px;margin-bottom:16px}
.kicker{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.device{font-size:27px;font-weight:750;margin:6px 0 4px;letter-spacing:-.02em}
.status{
  font-size:24px;font-weight:750;white-space:nowrap;display:flex;align-items:center;gap:10px;
  padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.6);
}
.status.online{color:var(--green)}
.status.offline{color:var(--red)}
.status.unknown{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 16%,transparent)}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:20px}
.stat .kicker{margin-bottom:2px}
.stat .num{font-size:19px;font-weight:650;margin-top:6px;overflow-wrap:anywhere;letter-spacing:-.01em}

/* 事件 */
.section{font-size:16px;font-weight:700;margin:32px 0 14px;padding-left:2px}
.events{list-style:none;margin:0;padding:0}
.events li{display:flex;gap:18px;padding:14px 2px;border-bottom:1px solid var(--line)}
.events li:last-child{border-bottom:0}
.time{font-size:12px;color:var(--muted);min-width:150px;font-variant-numeric:tabular-nums}
.message{overflow-wrap:anywhere;flex:1;font-size:14px}
.kind-error{color:var(--red)}
.kind-success{color:var(--green)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}

/* 弹窗 */
dialog{
  width:min(600px,calc(100% - 28px));max-height:86vh;overflow:auto;
  border:1px solid var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.97);color:var(--text);padding:26px;
  box-shadow:0 30px 90px rgba(17,24,39,.18);
}
dialog::backdrop{background:rgba(30,41,59,.28);backdrop-filter:blur(4px)}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.modalhead h2{font-size:17px;margin:0;font-weight:700}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted)}
input,select{
  width:100%;border:1px solid var(--line);background:#f8f9fc;color:var(--text);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;min-width:0;
}
input:focus,select:focus{outline:none;border-color:#b9c9ff;background:#fff;box-shadow:0 0 0 3px rgba(79,124,255,.1)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=file]{padding:8px;font-size:13px}
.check{display:flex;align-items:center;gap:9px}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.settings-section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.settings-section h3{margin:0 0 12px;font-size:14px}
.setting-row{padding:10px 0}
.setting-row label{display:block;margin-bottom:6px}
.range-wrap{display:flex;align-items:center;gap:12px}
.range-wrap input[type=range]{padding:0;accent-color:var(--accent)}
.range-value{min-width:42px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.thumb{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#eef1f6}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;right:6px;top:6px;padding:3px 9px;font-size:12px;background:rgba(255,255,255,.92)}
.notice{font-size:13px;margin-top:12px;color:var(--gold);min-height:20px}

@media(max-width:680px){
  main{padding-top:26px}
  .hero{flex-direction:column;align-items:flex-start;padding:22px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1/-1}
  .panel{padding:18px}
  .time{min-width:0;width:104px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .formgrid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>
<body>
<div id="wall"></div><div id="shade"></div>
<main>
  <header class="top">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="eyebrow">Personal Network Monitor</div>
        <div class="title">Shimokin Monitor</div>
        <div class="sub">Tailscale 设备在线状态</div>
      </div>
    </div>
    <div class="actions"><button class="primary" onclick="openSettings()">设置</button></div>
  </header>

  <section class="panel hero">
    <div>
      <div class="kicker">正在监控的设备</div>
      <div class="device" id="target">shimokin</div>
      <div class="sub">每 <b id="interval">60</b> 秒自动检测 · 连续失败达到阈值才判离线</div>
    </div>
    <div id="status" class="status unknown"><span class="dot"></span>等待检测</div>
  </section>

  <section class="stats">
    <div class="panel stat"><div class="kicker">最后在线时间</div><div class="num" id="lastOnline">—</div></div>
    <div class="panel stat"><div class="kicker">最后检测时间</div><div class="num" id="lastCheck">—</div></div>
    <div class="panel stat"><div class="kicker">连续失败次数</div><div class="num" id="failures">0</div></div>
  </section>

  <h2 class="section">最近运行事件</h2>
  <section class="panel"><ul class="events" id="events"><li>正在读取监控数据…</li></ul></section>
  <div class="foot" id="updated">每 5 秒自动刷新 · 管理操作需要密码验证</div>
</main>

<dialog id="settings">
  <div class="modalhead"><h2>设置</h2><button onclick="closeDialog('settings')">关闭</button></div>
  <form id="smtpForm">
    <div class="formgrid">
      <div class="field full check"><input id="enabled" type="checkbox"><label for="enabled">启用 SMTP 邮件告警</label></div>
      <div class="field"><label>SMTP 服务器</label><input id="host" placeholder="smtp.qq.com" required></div>
      <div class="field"><label>端口</label><input id="port" type="number" min="1" max="65535" value="465" required></div>
      <div class="field"><label>连接方式</label><select id="ssl"><option value="true">SSL（通常 465）</option><option value="false">STARTTLS（通常 587）</option></select></div>
      <div class="field"><label>发件邮箱账号</label><input id="username" type="email" placeholder="name@qq.com"></div>
      <div class="field"><label>发件人地址</label><input id="from" type="email" placeholder="留空则使用账号"></div>
      <div class="field"><label>收件邮箱（多个用逗号分隔）</label><input id="to" placeholder="you@example.com"></div>
      <div class="field full"><label>SMTP 授权码 / 密码</label><input id="password" type="password" placeholder="留空表示保持当前授权码"></div>
    </div>
    <div class="hint">QQ 邮箱请填写邮箱设置中生成的 SMTP 授权码，不是网页登录密码。授权码保存在服务器，不会回传到网页。</div>
    <div class="row"><button type="button" onclick="testMail()">发送测试邮件</button><button class="primary" type="submit">保存邮件设置</button></div>
    <div class="notice" id="smtpMsg"></div>
  </form>
  <section class="settings-section">
    <h3>背景外观</h3>
    <div class="setting-row"><label for="wallOpacity">背景图片透明度</label><div class="range-wrap"><input id="wallOpacity" type="range" min="10" max="100" step="5" value="100"><span class="range-value" id="wallOpacityValue">100%</span></div></div>
    <div class="setting-row"><label for="shadeStrength">背景遮罩强度（降低可让图片更清晰）</label><div class="range-wrap"><input id="shadeStrength" type="range" min="0" max="85" step="5" value="35"><span class="range-value" id="shadeStrengthValue">35%</span></div></div>
    <div class="hint">滑动立即生效，设置保存在当前浏览器。图片透明度和遮罩强度可分别调整。</div>
  </section>
</dialog>
<script>
const $=id=>document.getElementById(id);
const BUILTIN=["/bg/p103613710.jpg","/bg/p113114703.jpg","/bg/p120337189.jpg","/bg/p94927949.jpg"];
let bgList=[],bgTimer=null,bgSeconds=15,lastPick="";

function fmt(v){if(!v)return "—";try{return new Date(v).toLocaleString("zh-CN",{hour12:false})}catch{return v}}
async function api(url,opts={}){const r=await fetch(url,{cache:"no-store",...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"HTTP "+r.status);return d}

async function refresh(){
  try{
    const s=await api("/api/status");
    const st=$("status");
    st.className="status "+s.status;
    const words={online:"在线",offline:"离线",unknown:"等待检测"};
    st.replaceChildren();
    const dot=document.createElement("span");dot.className="dot";
    st.append(dot,document.createTextNode(words[s.status]||s.status));
    $("target").textContent=s.target;
    $("interval").textContent=s.interval;
    $("lastOnline").textContent=fmt(s.last_online);
    $("lastCheck").textContent=fmt(s.last_check);
    $("failures").textContent=s.failures;
    $("updated").textContent="更新于 "+new Date().toLocaleTimeString("zh-CN",{hour12:false});
    const list=$("events");list.replaceChildren();
    if(!s.events?.length){const li=document.createElement("li");li.textContent="暂无事件";list.append(li)}
    else for(const e of s.events){
      const li=document.createElement("li"),t=document.createElement("span"),m=document.createElement("span");
      t.className="time";t.textContent=fmt(e.time);
      m.className="message kind-"+(e.kind||"info");m.textContent=e.message;
      li.append(t,m);list.append(li);
    }
  }catch(e){$("updated").textContent="连接失败："+e.message}
}

function closeDialog(id){$(id).close()}

async function openSettings(){
  try{
    const d=await api("/api/config"),m=d.smtp;
    $("enabled").checked=m.enabled;$("host").value=m.host;$("port").value=m.port;
    $("ssl").value=String(m.use_ssl);$("username").value=m.username;
    $("from").value=m.from_addr;$("to").value=(m.to_addrs||[]).join(", ");
    $("password").value="";$("smtpMsg").textContent="";
    $("settings").showModal();
  }catch(e){alert(e.message)}
}

$("smtpForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("smtpMsg").textContent="正在保存…";
  try{
    await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({smtp:{
      enabled:$("enabled").checked,host:$("host").value,port:Number($("port").value),
      use_ssl:$("ssl").value==="true",username:$("username").value,from_addr:$("from").value,
      to_addrs:$("to").value.split(",").map(x=>x.trim()).filter(Boolean),password:$("password").value
    }})});
    $("password").value="";
    $("smtpMsg").textContent="保存成功。";
  }catch(e){$("smtpMsg").textContent="保存失败："+e.message}
});

async function testMail(){
  $("smtpMsg").textContent="正在发送测试邮件…";
  try{const d=await api("/api/test-email",{method:"POST"});$("smtpMsg").textContent=d.message}
  catch(e){$("smtpMsg").textContent="发送失败："+e.message}
}

/* 随机壁纸：在线 API + 本地兜底 */
const API_SRC=[
  "https://t.alcy.cc/pc",
  "https://t.mwm.moe/pc",
  "https://t.mwm.moe/mp",
  "https://www.dmoe.cc/random.php"
];
let apiCursor=0;
function bust(u){return u+(u.includes("?")?"&":"?")+"_="+Date.now()}
function loadImg(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(u);im.onerror=rej;im.src=u})}
async function nextWall(){
  for(let i=0;i<API_SRC.length;i++){
    const idx=(apiCursor+i)%API_SRC.length;
    const u=bust(API_SRC[idx]);
    try{
      await loadImg(u);
      apiCursor=(idx+1)%API_SRC.length;
      $("wall").style.backgroundImage=`url("${u}")`;
      return;
    }catch{}
  }
  $("wall").style.backgroundImage="none";
}
function applyAppearance(){
  const wallOpacity=Number(localStorage.getItem("wallOpacity")??100);
  const shadeStrength=Number(localStorage.getItem("shadeStrength")??35);
  $("wall").style.opacity=wallOpacity/100;
  $("wallOpacity").value=wallOpacity;
  $("wallOpacityValue").textContent=wallOpacity+"%";
  $("shadeStrength").value=shadeStrength;
  $("shadeStrengthValue").textContent=shadeStrength+"%";
  const a=shadeStrength/100;
  $("shade").style.background=`linear-gradient(180deg,rgba(247,249,252,${a}),rgba(247,249,252,${Math.min(.92,a+.12)}) 45%,rgba(242,244,248,${Math.min(.96,a+.22)}))`;
}
$("wallOpacity").addEventListener("input",e=>{localStorage.setItem("wallOpacity",e.target.value);applyAppearance()});
$("shadeStrength").addEventListener("input",e=>{localStorage.setItem("shadeStrength",e.target.value);applyAppearance()});
applyAppearance();
nextWall();
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
